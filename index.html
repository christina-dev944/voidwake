<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidwake</title>
<style>
  :root { --bg:#0a0a0f; --fg:#e8e8f0; --accent:#8a5cff; --danger:#ff4d6d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  /* canvas stays centered in the viewport; the side panel floats over the right
     margin so it never shifts the playfield off-center */
  #wrap { position:relative; display:flex; align-items:center; justify-content:center;
    height:100%; }
  #main { display:flex; flex-direction:column; gap:8px; }
  canvas { background:#06060b; border:1px solid #23233a; border-radius:8px;
    box-shadow:0 0 60px -20px var(--accent); touch-action:none; }
  /* WAVE/LVL/SCORE — top, right-aligned over the playfield */
  #hud { display:flex; gap:18px; justify-content:flex-end; font-size:13px; letter-spacing:.5px; color:#a9a9c8; }
  #hud b { color:var(--fg); }
  /* positioned in JS (resize) so it sits just right of the centered canvas */
  #side { position:absolute; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:14px; width:232px; }
  #side .hint { line-height:1.85; }
  #controls { white-space:nowrap; }   /* keep each control on a single line */
  .hint b { color:#8a8aa6; font-weight:600; }
  .shdr { color:#8a5cff; font-weight:bold; letter-spacing:1px; margin-bottom:5px; }
  /* bottom HUD strip — sits OUTSIDE the canvas so status bars never block the
     playfield while dodging near the bottom (#41) */
  #hud2 { display:flex; align-items:center; gap:16px; height:22px; font-size:12px; color:#a9a9c8; }
  #hpbar { position:relative; width:220px; height:18px; background:#0c0c18;
    border:1px solid #2a2a48; border-radius:5px; overflow:hidden; }
  #hpfill { position:absolute; inset:0 auto 0 0; width:100%; background:#3fb84f; }
  #hptext { position:absolute; left:8px; top:0; line-height:18px; font-weight:bold; color:#f0f0f8; }
  #statwrap { display:flex; align-items:center; gap:8px; }
  /* the laser label is a fixed string ('ENERGY') so the energy bar never shifts
     when the state flips (#50); min-width keeps it from reflowing either way */
  #statlbl { display:inline-block; min-width:52px; white-space:nowrap; }
  #statbar { position:relative; width:150px; height:8px; background:#26264a; border-radius:3px; overflow:hidden; }
  #statfill { height:100%; width:0; background:#7cf7ff; }
  /* overlay that divides the bar into charge segments for multi-charge actives (#51) */
  #statseg { position:absolute; inset:0; display:none; pointer-events:none; }
  .hint { font-size:11px; color:#5c5c78; }
  .hint a { color:#8a5cff; text-decoration:none; }
  .hint a:hover { text-decoration:underline; }
  /* non-blocking level-up panel (#26) — lives in the side rail, OUTSIDE the playfield */
  #levelup { display:none; background:rgba(18,18,42,0.6); border:1px solid #2a2a48;
    border-radius:8px; padding:10px; }
  #levelup .lu-hdr { color:#8a5cff; font-weight:bold; letter-spacing:1px; font-size:13px; }
  #levelup .lu-q { color:#ffd24d; font-size:11px; margin-left:6px; letter-spacing:0; }
  #levelup .lu-sub { color:#7a7a98; font-size:10px; margin:2px 0 8px; }
  #levelup .lu-card { display:block; width:100%; text-align:left; background:#14142a;
    border:1.5px solid #3a3a5c; border-radius:7px; padding:8px 10px; margin-bottom:8px;
    color:var(--fg); cursor:pointer; font-family:inherit; }
  #levelup .lu-card:last-child { margin-bottom:0; }
  #levelup .lu-card:hover { border-color:#8a5cff; background:#1a1a34; }
  #levelup .lu-ex { border-color:#c9a24a; }
  #levelup .lu-name { font-weight:bold; font-size:13px; color:#8a5cff; margin-bottom:3px; }
  #levelup .lu-ex .lu-name { color:#e0b24a; }
  #levelup .lu-desc { font-size:11px; color:#b4b4d0; line-height:1.3; }
  #levelup .lu-tag { font-size:9px; color:#c9a24a; margin-left:6px; font-weight:600; }
</style>
</head>
<body>
<div id="wrap">
  <div id="main">
    <div id="hud">
      <span>WAVE <b id="h-wave">0</b></span>
      <span>LVL <b id="h-lvl">1</b></span>
      <span>SCORE <b id="h-score">0</b></span>
    </div>
    <canvas id="c"></canvas>
    <div id="hud2">
      <div id="hpbar"><div id="hpfill"></div><span id="hptext">100 / 100</span></div>
      <div id="statwrap"><span id="statlbl"></span><div id="statbar"><div id="statfill"></div><div id="statseg"></div></div></div>
    </div>
  </div>
  <aside id="side">
    <div id="levelup"></div>
    <div id="controls" class="hint">
      <div class="shdr">CONTROLS</div>
      <b>Move</b> &nbsp;WASD / Arrows<br>
      <b>Shift</b> &nbsp;focus (slow, small hitbox)<br>
      <b>Space</b> &nbsp;active ability<br>
      <b>T</b> &nbsp;aim mode<br>
      <b>M</b> &nbsp;mute<br>
      <b>Esc / P</b> &nbsp;pause
    </div>
    <div class="hint"><a href="https://github.com/christina-dev944/voidwake" target="_blank" rel="noopener">source on GitHub ↗</a></div>
  </aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
